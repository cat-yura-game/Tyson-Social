name: Build native Tyson iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Tyson app icon sizes
        run: |
          mkdir -p ios-native/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios-native/Assets.xcassets/TysonLogo.imageset
          cp logo.png ios-native/Assets.xcassets/TysonLogo.imageset/tyson-logo.png
          sips -z 40 40 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-20@2x.png
          sips -z 60 60 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-20@3x.png
          sips -z 58 58 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-29@2x.png
          sips -z 87 87 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-29@3x.png
          sips -z 80 80 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-40@2x.png
          sips -z 120 120 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-40@3x.png
          sips -z 120 120 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-60@2x.png
          sips -z 180 180 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-60@3x.png
          sips -z 1024 1024 logo.png --out ios-native/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate
      - name: Build unsigned iPhone app
        working-directory: ios-native
        run: |
          xcodebuild -project TysonSocial.xcodeproj -scheme TysonSocial -configuration Release -sdk iphoneos -derivedDataPath ../build/native-ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/native-ios/Build/Products/Release-iphoneos/TysonSocial.app build/Payload/TysonSocial.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' build/Payload/TysonSocial.app/Info.plist)" = "TysonSocial"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/TysonSocial.app/Info.plist)" = "eu.tysonsocial.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' build/Payload/TysonSocial.app/Info.plist)" = "APPL"
          codesign --force --deep --sign - --timestamp=none build/Payload/TysonSocial.app
          codesign --verify --deep --strict --verbose=2 build/Payload/TysonSocial.app
          cd build
          zip -qry TysonSocial-native-sideload.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TysonSocial-native-iPhone-sideload
          path: build/TysonSocial-native-sideload.ipa
          retention-days: 14
