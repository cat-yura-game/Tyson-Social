name: TysonSocial
options:
  bundleIdPrefix: eu.tysonsocial
  deploymentTarget:
    iOS: "17.0"
targets:
  TysonSocial:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - Info.plist
    resources:
      - Assets.xcassets
      - LaunchScreen.storyboard
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.tysonsocial.app
      SWIFT_VERSION: 5.9
      TARGETED_DEVICE_FAMILY: "1"
