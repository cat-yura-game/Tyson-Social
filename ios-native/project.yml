name: TysonSocial
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.9.1
options:
  bundleIdPrefix: eu.tysonsocial
  deploymentTarget:
    iOS: "17.0"
targets:
  TysonSocial:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - Info.plist
    resources:
      - Assets.xcassets
      - LaunchScreen.storyboard
    dependencies:
      - package: Sodium
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.tysonsocial.app
      SWIFT_VERSION: 5.9
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: 0.5.3
      CURRENT_PROJECT_VERSION: 19
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_MACCATALYST: NO
